name: homeshard

# Homeshard — self-hostable, Minecraft-first game-server manager.
#
# Quick start:
#   cp .env.example .env      # then edit .env
#   docker compose up -d --build                    # dashboard + database
#   docker compose --profile agent up -d --build    # also run the homeserver agent
#
# IMPORTANT — identity mounts: the agent launches game containers through the
# host Docker socket, so the live-instance and cold-storage directories are
# bind-mounted at the SAME path inside the agent as on the host. Never remap
# only one side of those two.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-homeshard}
      POSTGRES_USER: ${POSTGRES_USER:-homeshard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-homeshard}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-homeshard} -d ${POSTGRES_DB:-homeshard}"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s
    volumes:
      - homeshard-db:/var/lib/postgresql/data

  # Applies each apps/web/drizzle/*.sql migration once, in filename order.
  migrate:
    image: postgres:17-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-homeshard}
    command:
      - sh
      - -c
      - >-
        until psql -h postgres -U ${POSTGRES_USER:-homeshard} -d ${POSTGRES_DB:-homeshard} -tAc "select 1" >/dev/null 2>&1; do sleep 1; done;
        psql -v ON_ERROR_STOP=1 -h postgres -U ${POSTGRES_USER:-homeshard} -d ${POSTGRES_DB:-homeshard} -c "CREATE TABLE IF NOT EXISTS homeshard_schema_migrations (name text PRIMARY KEY, applied_at timestamptz NOT NULL DEFAULT now())";
        if [ "$$(psql -h postgres -U ${POSTGRES_USER:-homeshard} -d ${POSTGRES_DB:-homeshard} -tAc "SELECT count(*) FROM homeshard_schema_migrations")" = "0" ] && [ "$$(psql -h postgres -U ${POSTGRES_USER:-homeshard} -d ${POSTGRES_DB:-homeshard} -tAc "SELECT to_regclass('public.users') IS NOT NULL")" = "t" ];
        then psql -v ON_ERROR_STOP=1 -h postgres -U ${POSTGRES_USER:-homeshard} -d ${POSTGRES_DB:-homeshard} -c "INSERT INTO homeshard_schema_migrations(name) VALUES ('0000_calm_nuke.sql') ON CONFLICT DO NOTHING";
        fi;
        for f in $$(ls /migrations/*.sql | sort); do name=$$(basename "$$f");
        if [ "$$(psql -h postgres -U ${POSTGRES_USER:-homeshard} -d ${POSTGRES_DB:-homeshard} -tAc "SELECT count(*) FROM homeshard_schema_migrations WHERE name = '$$name'")" = "0" ];
        then echo "applying $$name"; { cat "$$f"; echo "INSERT INTO homeshard_schema_migrations(name) VALUES ('$$name');"; } | psql -v ON_ERROR_STOP=1 --single-transaction -h postgres -U ${POSTGRES_USER:-homeshard} -d ${POSTGRES_DB:-homeshard};
        else echo "already applied $$name"; fi; done
    volumes:
      - ../../apps/web/drizzle:/migrations:ro

  web:
    image: ${HOMESHARD_WEB_IMAGE:-homeshard-web:local}
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-homeshard}:${POSTGRES_PASSWORD:-homeshard}@postgres:5432/${POSTGRES_DB:-homeshard}
      DATABASE_DRIVER: postgresjs
      # The owner account. Without Clerk keys the dashboard runs in single-owner
      # demo mode using this identity.
      OWNER_EMAIL: ${OWNER_EMAIL:-owner@example.com}
      # Shared secret the agent uses to post events to the web API (optional).
      AGENT_TOKEN: ${AGENT_TOKEN:-}
      # Optional Clerk auth for multi-user access.
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      # Optional Vercel Blob token for cloud pack staging.
      BLOB_READ_WRITE_TOKEN: ${BLOB_READ_WRITE_TOKEN:-}
      HOMESHARD_LOCAL_STAGING_DIR: /staging
      HOMESHARD_AGENT_OFFLINE_AFTER_SECS: ${HOMESHARD_AGENT_OFFLINE_AFTER_SECS:-90}
      HOMESHARD_MISSING_MODS_DIR: /missing-mods
      # Read-only access to the agent's instance + cold-storage dirs (identity
      # mounts) so the dashboard can serve pack files and stream mod jars.
      HOMESHARD_ACTIVE_ROOT: ${HOST_INSTANCES_DIR:-/srv/homeshard/instances}
      HOMESHARD_COLD_ROOT: ${HOST_COLD_DIR:-/srv/homeshard/cold}
    ports:
      - "${WEB_PORT:-8010}:3000"
    volumes:
      - ${HOST_STAGING_DIR:-./data/staging}:/staging
      - ${HOST_MISSING_MODS_DIR:-/srv/homeshard/missing-mods}:/missing-mods
      - ${HOST_INSTANCES_DIR:-/srv/homeshard/instances}:${HOST_INSTANCES_DIR:-/srv/homeshard/instances}:ro
      - ${HOST_COLD_DIR:-/srv/homeshard/cold}:${HOST_COLD_DIR:-/srv/homeshard/cold}:ro

  agent:
    profiles: ["agent"]
    image: ${HOMESHARD_AGENT_IMAGE:-homeshard-agent:local}
    build:
      context: ../..
      dockerfile: crates/agent/Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-homeshard}:${POSTGRES_PASSWORD:-homeshard}@postgres:5432/${POSTGRES_DB:-homeshard}
      HOMESHARD_AGENT_ID: ${HOMESHARD_AGENT_ID:-homeserver}
      # The agent image doubles as the lightweight fake Minecraft server while
      # an instance sleeps. Override when using a custom image tag.
      HOMESHARD_SLEEP_PROXY_IMAGE: ${HOMESHARD_SLEEP_PROXY_IMAGE:-homeshard-agent}
      # Hostname/IP players use to connect (e.g. a Tailscale MagicDNS name).
      # Shown in the dashboard; leave blank to display a placeholder.
      HOMESHARD_MAGIC_DNS: ${HOMESHARD_MAGIC_DNS:-}
      HOMESHARD_INSTANCE_STATUS_INTERVAL_SECS: ${HOMESHARD_INSTANCE_STATUS_INTERVAL_SECS:-15}
      # IP that game container ports bind to on the host. Use your Tailscale IP
      # to keep servers private, or 0.0.0.0 to expose on all interfaces.
      HOMESHARD_GAME_BIND_IP: ${HOMESHARD_GAME_BIND_IP:-0.0.0.0}
      HOMESHARD_GAME_PORT_START: ${HOMESHARD_GAME_PORT_START:-25600}
      HOMESHARD_GAME_PORT_END: ${HOMESHARD_GAME_PORT_END:-25699}
      HOMESHARD_MINECRAFT_IMAGE: ${HOMESHARD_MINECRAFT_IMAGE:-itzg/minecraft-server:java21}
      # JRE image for newer Minecraft (e.g. 26.x). Classic 1.x packs use the
      # image above; the agent picks the right one per pack automatically.
      HOMESHARD_MINECRAFT_IMAGE_MODERN: ${HOMESHARD_MINECRAFT_IMAGE_MODERN:-itzg/minecraft-server:java25}
      # Identity-mounted host directories (see IMPORTANT note above).
      HOMESHARD_ACTIVE_ROOT: ${HOST_INSTANCES_DIR:-/srv/homeshard/instances}
      HOMESHARD_COLD_ROOT: ${HOST_COLD_DIR:-/srv/homeshard/cold}
      HOMESHARD_STAGING_ROOT: /staging
      HOMESHARD_MAX_CONCURRENT_COMMANDS: ${HOMESHARD_MAX_CONCURRENT_COMMANDS:-6}
      # --- Headless CurseForge import (optional) ---
      # Set CF_API_KEY to import CurseForge modpack ZIPs directly (no Prism).
      # See the README for how to obtain a key. Author-restricted "blocked" mods
      # are read from the missing-mods dir below; upload them via the dashboard.
      CF_API_KEY: ${CF_API_KEY:-}
      HOMESHARD_MISSING_MODS_DIR: ${HOST_MISSING_MODS_DIR:-/srv/homeshard/missing-mods}
      BLOB_READ_WRITE_TOKEN: ${BLOB_READ_WRITE_TOKEN:-}
      RUST_LOG: homeshard_agent=info
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Identity mounts (host path == container path) — required.
      - ${HOST_INSTANCES_DIR:-/srv/homeshard/instances}:${HOST_INSTANCES_DIR:-/srv/homeshard/instances}
      - ${HOST_COLD_DIR:-/srv/homeshard/cold}:${HOST_COLD_DIR:-/srv/homeshard/cold}
      - ${HOST_STAGING_DIR:-./data/staging}:/staging
      # Blocked-mod uploads. Identity-mounted so servers the agent launches can
      # read the same host folder the dashboard writes uploads to.
      - ${HOST_MISSING_MODS_DIR:-/srv/homeshard/missing-mods}:${HOST_MISSING_MODS_DIR:-/srv/homeshard/missing-mods}

volumes:
  homeshard-db:
